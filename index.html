<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Spin and Win</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:'Segoe UI',sans-serif;
  background:#111;
  display:flex; justify-content:center; align-items:center; min-height:100vh;
}
.phone {
  width:390px; height:844px;
  background:linear-gradient(160deg,#1a0a3c 0%,#0d1a4a 40%,#1a0a3c 70%,#2a0a3c 100%);
  position:relative; overflow:hidden; border-radius:40px;
  border:2px solid rgba(255,255,255,0.08);
  box-shadow:0 30px 80px rgba(0,0,0,0.8);
  display:flex; flex-direction:column;
}
.city-svg-bg {
  position:absolute; bottom:50px; left:0; right:0;
  width:100%; opacity:0.35; pointer-events:none; z-index:0;
}
.status-bar {
  display:flex; justify-content:space-between; align-items:center;
  padding:10px 18px 4px; font-size:12px; color:white; font-weight:600;
  position:relative; z-index:10; background:#000; border-radius:38px 38px 0 0; flex-shrink:0;
}
.status-time { font-size:14px; font-weight:700; }
.status-icons { display:flex; gap:5px; align-items:center; }
.battery { background:#4caf50; border-radius:3px; padding:1px 6px; font-size:11px; font-weight:700; }
.top-nav {
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 18px 8px; position:relative; z-index:10; flex-shrink:0;
}
.back-btn { color:rgba(255,255,255,0.7); font-size:20px; cursor:pointer; }
.balance-wrap { display:flex; align-items:center; gap:8px; font-size:20px; font-weight:700; color:white; }
.add-btn {
  width:28px; height:28px; background:#00c853; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:20px; color:white; font-weight:300; box-shadow:0 0 12px rgba(0,200,83,0.5); cursor:pointer;
}
.nav-icons { display:flex; gap:8px; align-items:center; }
.share-btn,.info-btn {
  width:34px; height:34px; border:1.5px solid rgba(255,255,255,0.4); border-radius:50%;
  display:flex; align-items:center; justify-content:center; color:white; font-size:14px; cursor:pointer;
}
.bonus-btn {
  width:34px; height:34px; border:1.5px solid #ffd700; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  color:#ffd700; font-size:8px; font-weight:700; text-align:center; line-height:1.1;
  cursor:pointer; position:relative;
}
.bonus-plus {
  position:absolute; bottom:-2px; right:-2px; width:12px; height:12px;
  background:#ffd700; border-radius:50%; color:#000; font-size:9px; font-weight:900;
  display:flex; align-items:center; justify-content:center;
}
.subtitle {
  text-align:center; color:rgba(255,255,255,0.55); font-size:11px;
  letter-spacing:2.5px; text-transform:uppercase; margin-bottom:10px;
  position:relative; z-index:10; flex-shrink:0;
}

/* ===== STATE LOBBY ===== */
#state-lobby { flex:1; display:flex; flex-direction:column; position:relative; z-index:5; overflow:hidden; }
.lobby-main { flex:1; display:flex; gap:12px; padding:0 14px; overflow:hidden; }

/* Multiplier pills */
.multipliers { display:flex; flex-direction:column; gap:8px; width:172px; flex-shrink:0; }
.mult-btn {
  height:66px; border-radius:38px; border:none; cursor:pointer;
  font-size:22px; font-weight:800; color:white;
  text-shadow:0 2px 4px rgba(0,0,0,0.4);
  position:relative; transition:transform 0.12s, box-shadow 0.12s;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
}
.mult-btn::before {
  content:''; position:absolute; top:6px; left:14px; right:14px;
  height:28%; background:rgba(255,255,255,0.22); border-radius:20px;
}
.mult-btn:active { transform:scale(0.96); }
.mult-btn.selected { box-shadow:0 0 0 3px white, 0 8px 24px rgba(255,255,255,0.25) !important; }
.mult-x2  { background:linear-gradient(180deg,#4db8ff,#1e90ff,#1060cc); box-shadow:0 5px 18px rgba(30,144,255,0.4); }
.mult-x4  { background:linear-gradient(180deg,#dd66dd,#cc44cc,#8a2be2); box-shadow:0 5px 18px rgba(204,68,204,0.4); }
.mult-x5  { background:linear-gradient(180deg,#ffe566,#ffd700,#ddaa00); box-shadow:0 5px 18px rgba(255,215,0,0.4); }
.mult-x7  { background:linear-gradient(180deg,#66ee66,#33cc33,#22aa22); box-shadow:0 5px 18px rgba(51,204,51,0.4); }
.mult-x10 { background:linear-gradient(180deg,#ff7777,#ff4444,#cc2222); box-shadow:0 5px 18px rgba(255,68,68,0.4); }
.mult-x20 { background:linear-gradient(180deg,#33bb55,#22aa22,#116611); box-shadow:0 5px 18px rgba(34,170,34,0.4); }
.mult-sub { font-size:16px; font-weight:700; opacity:0.95; line-height:1; }

/* Mise panel */
.mise-panel {
  flex:1; background:rgba(5,10,40,0.75); border-radius:14px;
  border:1px solid rgba(255,255,255,0.1); padding:12px 10px;
  display:flex; flex-direction:column; gap:8px; overflow-y:auto;
}
.mise-header-title { color:white; font-size:15px; font-weight:700; }
.mise-header-total { color:white; font-size:18px; font-weight:800; }
.mise-row {
  display:flex; align-items:center; gap:8px;
  background:rgba(255,255,255,0.06); border-radius:8px; padding:7px 8px; flex-shrink:0;
}
.mise-row-color { width:32px; height:32px; border-radius:6px; flex-shrink:0; }
.mise-row-amount { color:white; font-size:14px; font-weight:600; flex:1; }
.mise-row-del { color:rgba(255,255,255,0.5); font-size:15px; cursor:pointer; padding:4px; }
.mise-row-del:hover { color:#ff6b6b; }

/* JOUER */
.jouer-wrap { padding:8px 14px 4px; flex-shrink:0; position:relative; z-index:10; }
.jouer-btn {
  width:100%; background:linear-gradient(135deg,#5bc8ff,#2979ff,#1565c0);
  border:none; border-radius:14px; color:white; font-size:17px; font-weight:800;
  padding:15px; cursor:pointer; letter-spacing:2px;
  box-shadow:0 6px 20px rgba(41,121,255,0.5); transition:transform 0.1s;
}
.jouer-btn:active { transform:scale(0.98); }

/* Bottom controls */
.bottom-section { padding:6px 14px 0; flex-shrink:0; position:relative; z-index:10; }
.quick-btns { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:7px; }
.quick-btn {
  background:rgba(70,130,200,0.3); border:1px solid rgba(100,160,255,0.25);
  border-radius:10px; color:white; font-size:13px; font-weight:700;
  padding:9px 4px; cursor:pointer; text-align:center; transition:background 0.15s;
}
.quick-btn:hover { background:rgba(70,130,200,0.5); }
.bet-row {
  display:flex; gap:10px; align-items:center;
  background:rgba(255,255,255,0.07); border-radius:12px; padding:9px 14px;
}
.bet-input-wrap { flex:1; }
.bet-amount-display { font-size:22px; font-weight:700; color:white; display:block; margin-bottom:2px; }
.bet-limits { font-size:10px; color:rgba(255,255,255,0.35); }
.mise-action-btn {
  background:linear-gradient(135deg,#5bc8ff,#1976d2); border:none; border-radius:10px;
  color:white; font-size:14px; font-weight:800; padding:12px 20px;
  cursor:pointer; letter-spacing:1px; box-shadow:0 4px 14px rgba(33,150,243,0.4);
  transition:transform 0.1s;
}
.mise-action-btn:active { transform:scale(0.96); }
.msg-bar {
  text-align:center; font-size:11px; font-weight:600; padding:4px 14px;
  min-height:20px; flex-shrink:0; position:relative; z-index:10;
}

/* Footer */
.footer {
  display:flex; background:#000; border-top:1px solid rgba(255,255,255,0.08);
  border-radius:0 0 38px 38px; position:relative; z-index:10; flex-shrink:0;
}
.footer-btn {
  flex:1; background:transparent; border:none; color:rgba(255,255,255,0.85);
  font-size:12px; font-weight:700; padding:13px 8px 18px;
  display:flex; align-items:center; justify-content:center; gap:6px;
  letter-spacing:0.8px; text-transform:uppercase; cursor:pointer;
}
.footer-divider { width:1px; background:rgba(255,255,255,0.12); margin:8px 0; }

/* ===== STATE WHEEL ===== */
#state-wheel { flex:1; position:relative; z-index:5; }
.wheel-container {
  position:absolute; left:-190px; top:50%; transform:translateY(-60%);
  width:380px; height:380px;
}
.wheel-static {
  position:absolute; inset:0; border-radius:50%;
  background:radial-gradient(circle,transparent 0%,transparent 85%,#f9a825 90.5%,#e65100 95%,#bf360c 100%);
  box-shadow:0 0 0 3px #ffd740,0 0 28px rgba(255,183,0,0.6),0 8px 32px rgba(0,0,0,0.6);
  z-index:4; pointer-events:none;
}
.wheel-static::before {
  content:''; position:absolute; inset:5px; border-radius:50%;
  border:2px dotted rgba(255,255,255,0.45);
}
.wheel-spin-inner {
  position:absolute; inset:14px; border-radius:50%; overflow:hidden; z-index:3;
}
.wheel-svg-el { width:100%; height:100%; }
.wheel-hub {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:52px; height:52px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#90caf9,#1976d2 50%,#0d47a1 100%);
  box-shadow:0 0 0 4px #ffd740,0 0 14px rgba(255,215,0,0.4),0 4px 12px rgba(0,0,0,0.5);
  z-index:10;
}
.arrow-wrapper {
  position:absolute; left:338px; top:50%; transform:translateY(-50%); z-index:20;
}
.mise-panel-spin {
  position:absolute; right:14px; top:50%; transform:translateY(-60%);
  height:420px; width:162px;
  background:rgba(5,10,40,0.82); border-radius:14px;
  border:1px solid rgba(255,255,255,0.1);
  padding:14px 12px; display:flex; flex-direction:column; gap:8px;
  overflow-y:auto; z-index:10;
}

/* Modal règles */
.rules-overlay {
  position:absolute; inset:0; background:rgba(0,0,0,0.85);
  display:flex; align-items:center; justify-content:center;
  z-index:100; border-radius:38px; animation:fadeIn 0.3s ease;
}
.rules-box {
  background:linear-gradient(160deg,#1a0a3c,#0d1a4a);
  border:1.5px solid rgba(255,215,0,0.4); border-radius:20px;
  padding:24px 22px; width:330px; max-height:700px; overflow-y:auto;
}
.rules-header {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:18px;
}
.rules-title {
  color:#ffd700; font-size:16px; font-weight:800; letter-spacing:1px;
  text-transform:uppercase;
}
.rules-close {
  width:30px; height:30px; border-radius:50%;
  background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2);
  color:white; font-size:16px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.rules-close:hover { background:rgba(255,255,255,0.2); }
.rules-list { display:flex; flex-direction:column; gap:14px; }
.rules-item {
  display:flex; gap:12px; align-items:flex-start;
}
.rules-num {
  width:26px; height:26px; border-radius:50%; flex-shrink:0;
  background:linear-gradient(135deg,#ffd700,#f9a825);
  color:#000; font-size:12px; font-weight:900;
  display:flex; align-items:center; justify-content:center;
}
.rules-text {
  color:rgba(255,255,255,0.85); font-size:13px; line-height:1.6; flex:1;
}
.rules-text strong { color:#ffd700; }
.rules-divider {
  height:1px; background:rgba(255,255,255,0.08); margin:4px 0;
}
.rules-footer {
  margin-top:18px; padding:12px; border-radius:10px;
  background:rgba(255,107,107,0.1); border:1px solid rgba(255,107,107,0.3);
  color:rgba(255,255,255,0.7); font-size:11px; line-height:1.6; text-align:center;
}

/* Result overlay */
.result-overlay {
  position:absolute; inset:0; background:rgba(0,0,0,0.8);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  z-index:50; border-radius:38px; animation:fadeIn 0.4s ease;
}
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.result-box {
  background:linear-gradient(160deg,#1a0a3c,#0d1a4a);
  border:2px solid rgba(255,215,0,0.5); border-radius:24px;
  padding:28px 36px; text-align:center; min-width:260px;
  box-shadow:0 0 60px rgba(255,215,0,0.15);
}
.result-sector-label { color:rgba(255,255,255,0.6); font-size:12px; letter-spacing:2px; text-transform:uppercase; margin-bottom:6px; }
.result-mult { font-size:68px; font-weight:900; margin-bottom:4px; }
.result-detail { color:rgba(255,255,255,0.7); font-size:13px; margin-bottom:4px; }
.result-gain { color:white; font-size:20px; font-weight:700; margin-bottom:6px; }
.result-gain.win span { color:#00e676; }
.result-gain.lose span { color:#ff5252; }
.result-new-balance { color:rgba(255,215,0,0.8); font-size:13px; margin-bottom:22px; }
.result-btn {
  background:linear-gradient(135deg,#5bc8ff,#2979ff); border:none; border-radius:12px;
  color:white; font-size:15px; font-weight:800; padding:13px 36px;
  cursor:pointer; letter-spacing:1px; transition:transform 0.1s;
}
.result-btn:active { transform:scale(0.97); }

.hidden { display:none !important; }
</style>
</head>
<body>
<div class="phone">

  <!-- City BG -->
  <svg class="city-svg-bg" viewBox="0 0 390 220" xmlns="http://www.w3.org/2000/svg">
    <rect x="178" y="10" width="5" height="30" fill="rgba(120,80,200,0.8)"/>
    <rect x="175" y="40" width="11" height="8" fill="rgba(120,80,200,0.8)"/>
    <rect x="170" y="48" width="21" height="8" fill="rgba(120,80,200,0.8)"/>
    <rect x="165" y="56" width="31" height="60" fill="rgba(120,80,200,0.8)"/>
    <rect x="160" y="116" width="41" height="50" fill="rgba(120,80,200,0.8)"/>
    <rect x="155" y="166" width="51" height="54" fill="rgba(100,60,180,0.8)"/>
    <rect x="0"   y="140" width="60" height="80" fill="rgba(80,50,150,0.6)"/>
    <rect x="60"  y="160" width="40" height="60" fill="rgba(70,40,130,0.6)"/>
    <rect x="100" y="150" width="50" height="70" fill="rgba(80,50,150,0.6)"/>
    <rect x="260" y="150" width="50" height="70" fill="rgba(80,50,150,0.6)"/>
    <rect x="310" y="140" width="40" height="80" fill="rgba(70,40,130,0.6)"/>
    <rect x="350" y="160" width="40" height="60" fill="rgba(80,50,150,0.6)"/>
    <rect x="0"   y="215" width="390" height="5" fill="rgba(150,100,255,0.3)"/>
  </svg>

  <!-- STATUS BAR -->
  <div class="status-bar">
    <span class="status-time" id="clock">00:00</span>
    <!-- <div class="status-icons">
      <span style="font-size:11px">⏰ 🔵 4.5G 📶</span>
      <span class="battery">76</span>
    </div> -->
  </div>

  <!-- TOP NAV -->
  <div class="top-nav">
    <div class="back-btn">←</div>
    <div class="balance-wrap">
      <span id="balanceDisplay">100 000 F</span>
      <div class="add-btn">+</div>
    </div>
    <div class="nav-icons">
      <!-- <div class="share-btn">⇪</div>
      <div class="bonus-btn">☆<br><span style="font-size:7px">BONUS</span><div class="bonus-plus">+</div></div> -->
      <div class="info-btn" onclick="openRules()">ⓘ</div>
    </div>
  </div>
  <div class="subtitle">Spin and Win</div>

  <!-- ========== LOBBY ========== -->
  <div id="state-lobby">
    <div class="lobby-main">
      <!-- Pills -->
      <div class="multipliers">
        <button class="mult-btn mult-x2"  data-mult="2"  onclick="selectMult(this)">x2</button>
        <button class="mult-btn mult-x4"  data-mult="4"  onclick="selectMult(this)">x4</button>
        <button class="mult-btn mult-x5"  data-mult="5"  onclick="selectMult(this)">x5</button>
        <button class="mult-btn mult-x7"  data-mult="7"  onclick="selectMult(this)">x7</button>
        <button class="mult-btn mult-x10" data-mult="10" onclick="selectMult(this)">x10</button>
        <button class="mult-btn mult-x20" data-mult="20" onclick="selectMult(this)">x20</button>
      </div>
      <!-- Mise panel -->
      <div class="mise-panel">
        <div class="mise-header-title">Votre mise :</div>
        <div class="mise-header-total" id="miseTotalDisplay"></div>
        <div id="miseRows"></div>
      </div>
    </div>

    <!-- JOUER -->
    <div class="jouer-wrap hidden" id="jouerWrap">
      <button class="jouer-btn" onclick="startSpin()">JOUER</button>
    </div>

    <!-- Bottom -->
    <div class="bottom-section">
      <div class="quick-btns">
        <button class="quick-btn" onclick="setBet('min')">MIN.</button>
        <button class="quick-btn" onclick="setBet('x2')">X2</button>
        <button class="quick-btn" onclick="setBet('div2')">X/2</button>
        <button class="quick-btn" onclick="setBet('max')">MAX.</button>
      </div>
      <div class="bet-row">
        <div class="bet-input-wrap">
          <span class="bet-amount-display" id="betDisplay">200 F</span>
          <span class="bet-limits">min 200 F  –  max 710 001 F</span>
        </div>
        <button class="mise-action-btn" onclick="placeMise()">MISE</button>
      </div>
    </div>
    <div class="msg-bar" id="msgBar"></div>
  </div>

  <!-- ========== WHEEL ========== -->
  <div id="state-wheel" class="hidden">
    <div class="wheel-container">
      <div class="wheel-static"></div>
      <div class="wheel-spin-inner" id="wheelSpinner">
        <svg id="wheelSvg" class="wheel-svg-el" viewBox="0 0 352 352" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div class="wheel-hub"></div>
      <div class="arrow-wrapper">
        <svg width="50" height="28" viewBox="0 0 50 28" xmlns="http://www.w3.org/2000/svg"
             style="filter:drop-shadow(0 2px 8px rgba(0,0,0,0.8))">
          <defs>
            <radialGradient id="bG" cx="40%" cy="35%">
              <stop offset="0%" stop-color="#90caf9"/>
              <stop offset="55%" stop-color="#1976d2"/>
              <stop offset="100%" stop-color="#0d47a1"/>
            </radialGradient>
            <linearGradient id="tG" x1="100%" y1="0%" x2="0%" y2="0%">
              <stop offset="0%" stop-color="#fff176"/>
              <stop offset="50%" stop-color="#ffd740"/>
              <stop offset="100%" stop-color="#f9a825"/>
            </linearGradient>
          </defs>
          <polygon points="36,7 16,14 36,21" fill="url(#tG)"/>
          <circle cx="40" cy="14" r="9" fill="url(#bG)"/>
          <circle cx="40" cy="14" r="9" fill="none" stroke="#ffe57a" stroke-width="2.5"/>
          <circle cx="37" cy="11" r="2.5" fill="rgba(255,255,255,0.35)"/>
        </svg>
      </div>
    </div>
    <!-- Mise panel tall -->
    <div class="mise-panel-spin" id="spinMisePanel"></div>
  </div>

  <div class="footer">
    <button class="footer-btn">⚙️ PARAMÈTRES</button>
    <div class="footer-divider"></div>
    <button class="footer-btn">⚡ EN UN CLIC</button>
  </div>
</div>

<script>
// ══════════════ CONSTANTS ══════════════
const WHEEL_ORDER = [4,2,10,2,5,2,4,2,5,4,2,20,7,2,4,5,2,4,2,7];
const NUMBERS     = [2,4,5,7,10,20];
const COLORS      = {2:'#1e90ff',4:'#cc44cc',5:'#ffd700',7:'#33cc33',10:'#ff4444',20:'#22aa22'};
const MIN_BET     = 200;
const MAX_BET     = 710001;
const DEFAULT_BAL = 100000;

// ══════════════ STATE ══════════════
let balance     = loadBalance();
let betAmount   = 200;
let selectedNum = null;
let bets        = {};        // { mult: amount }
let currentRot  = 0;

// ══════════════ PERSISTENCE ══════════════
function loadBalance() {
  try { const b = parseFloat(localStorage.getItem('spinwin_balance')); return b > 0 ? b : DEFAULT_BAL; }
  catch(e) { return DEFAULT_BAL; }
}
function saveBalance() {
  try { localStorage.setItem('spinwin_balance', balance); } catch(e) {}
}

// ══════════════ CLOCK ══════════════
function updateClock() {
  const n = new Date();
  document.getElementById('clock').textContent =
    String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
}
updateClock(); setInterval(updateClock, 10000);

// ══════════════ BALANCE DISPLAY ══════════════
function refreshBalance() {
  document.getElementById('balanceDisplay').textContent = formatF(balance);
  saveBalance();
}

function formatF(n) {
  return n.toLocaleString('fr-FR', {maximumFractionDigits:0}) + ' F';
}

// ══════════════ BET AMOUNT ══════════════
function setBet(action) {
  if      (action==='min')  betAmount = MIN_BET;
  else if (action==='x2')   betAmount = Math.min(betAmount*2, MAX_BET);
  else if (action==='div2') betAmount = Math.max(Math.round(betAmount/2), MIN_BET);
  else if (action==='max')  betAmount = Math.min(Math.floor(balance - totalBets()), MAX_BET);
  betAmount = Math.max(MIN_BET, Math.min(MAX_BET, Math.round(betAmount)));
  document.getElementById('betDisplay').textContent = formatF(betAmount);
}
function totalBets() { return Object.values(bets).reduce((s,v)=>s+v,0); }

// ══════════════ SELECT MULT ══════════════
function selectMult(btn) {
  document.querySelectorAll('.mult-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedNum = parseInt(btn.dataset.mult);
  showMsg('');
}

// ══════════════ PLACE MISE ══════════════
function placeMise() {
  if (!selectedNum) { showMsg('Choisissez un résultat d\'abord !', 'red'); return; }
  const raw = betAmount;
  if (raw < MIN_BET) { showMsg(`Mise minimum : ${formatF(MIN_BET)}`, 'red'); return; }
  if (raw > MAX_BET) { showMsg(`Mise maximum : ${formatF(MAX_BET)}`, 'red'); return; }
  if (totalBets() + raw > balance) {
    showMsg(`Solde insuffisant ! Dispo : ${formatF(balance - totalBets())}`, 'red'); return;
  }
  bets[selectedNum] = (bets[selectedNum] || 0) + raw;
  showMsg(`Mise ${formatF(raw)} sur x${selectedNum} ajoutée ✓`, 'green');
  refreshMiseUI();
}

function deleteMise(mult) {
  delete bets[mult];
  refreshMiseUI();
  // Remove selected highlight if this mult is deleted
  if (selectedNum === mult) {
    selectedNum = null;
    document.querySelectorAll('.mult-btn').forEach(b => b.classList.remove('selected'));
  }
}

function refreshMiseUI() {
  const total     = totalBets();
  const totalEl   = document.getElementById('miseTotalDisplay');
  const rowsEl    = document.getElementById('miseRows');
  const jouerWrap = document.getElementById('jouerWrap');

  totalEl.textContent = total > 0 ? formatF(total) : '';
  rowsEl.innerHTML = '';

  Object.entries(bets).forEach(([mult, amt]) => {
    const m = parseInt(mult);
    const row = document.createElement('div');
    row.className = 'mise-row';
    row.innerHTML = `
      <div class="mise-row-color" style="background:${COLORS[m]}"></div>
      <span class="mise-row-amount">${formatF(amt)}</span>
      <span class="mise-row-del" onclick="deleteMise(${m})">✕</span>`;
    rowsEl.appendChild(row);
  });

  // Update pill sub-amounts
  document.querySelectorAll('.mult-btn').forEach(btn => {
    const m = parseInt(btn.dataset.mult);
    const existing = btn.querySelector('.mult-sub');
    if (existing) existing.remove();
    if (bets[m]) {
      const sub = document.createElement('span');
      sub.className = 'mult-sub';
      sub.textContent = formatF(bets[m]);
      btn.appendChild(sub);
    }
  });

  jouerWrap.classList.toggle('hidden', total === 0);
}

function showMsg(txt, color='green') {
  const el = document.getElementById('msgBar');
  el.textContent = txt;
  el.style.color = color === 'red' ? '#ff5252' : '#00e676';
  if (txt) setTimeout(()=>{ if(el.textContent===txt) el.textContent=''; }, 3000);
}

// ══════════════ BUILD WHEEL SVG ══════════════
function buildWheel(rotDeg) {
  const cx=176, cy=176, r=174, N=WHEEL_ORDER.length;
  const step = (2*Math.PI)/N;
  function pt(a) { return {x: cx+r*Math.cos(a), y: cy+r*Math.sin(a)}; }

  const paths = WHEEL_ORDER.map((val,i)=>{
    const a0 = -Math.PI/2 + i*step, a1 = a0+step;
    const p1=pt(a0), p2=pt(a1);
    const d=`M${cx},${cy} L${p1.x.toFixed(2)},${p1.y.toFixed(2)} A${r},${r} 0 0,1 ${p2.x.toFixed(2)},${p2.y.toFixed(2)} Z`;
    const mid=a0+step/2;
    const lx=cx+r*0.66*Math.cos(mid), ly=cy+r*0.66*Math.sin(mid);
    const rot=mid*180/Math.PI+90;
    return `<path d="${d}" fill="${COLORS[val]}" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    <text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" fill="white"
      font-family="'Segoe UI',sans-serif" font-weight="800" font-size="15"
      text-anchor="middle" dominant-baseline="middle"
      transform="rotate(${rot.toFixed(1)},${lx.toFixed(1)},${ly.toFixed(1)})">x${val}</text>`;
  }).join('');

  document.getElementById('wheelSvg').innerHTML =
    `<defs><clipPath id="wc"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath></defs>
     <g clip-path="url(#wc)">${paths}</g>`;
}

// ══════════════ POPULATE SPIN MISE PANEL ══════════════
function populateSpinPanel() {
  const panel = document.getElementById('spinMisePanel');
  const total = totalBets();
  let html = `<div class="mise-header-title">Votre mise :</div>
              <div class="mise-header-total">${formatF(total)}</div>`;
  Object.entries(bets).forEach(([mult, amt])=>{
    const m = parseInt(mult);
    html += `<div class="mise-row">
      <div class="mise-row-color" style="background:${COLORS[m]}"></div>
      <span class="mise-row-amount">${formatF(amt)}</span>
      <span class="mise-row-del">✕</span>
    </div>`;
  });
  panel.innerHTML = html;
}

// ══════════════ SPIN LOGIC ══════════════
// Reproduit exactement la logique Python :
// - random.choice(NUMBERS)  → result value
// - random.choice(target_indexes) → target sector
// - Easing: 1-(1-prog)^3 sur 8s (Python) → ici 6s
function startSpin() {
  if (!Object.keys(bets).length) return;
  const total = totalBets();
  if (total > balance) { showMsg('Solde insuffisant !', 'red'); return; }

  // Déduire la mise
  balance -= total;
  refreshBalance();

  // Switch UI
  populateSpinPanel();
  document.getElementById('state-lobby').classList.add('hidden');
  document.getElementById('state-wheel').classList.remove('hidden');

  buildWheel();

  const spinner = document.getElementById('wheelSpinner');
  spinner.style.transition = 'none';
  spinner.style.transform  = `rotate(${currentRot}deg)`;

  // === LOGIQUE PYTHON REPRODUITE ===
  // Tirer un résultat parmi NUMBERS (équiprobable sur les valeurs, pas les secteurs)
  //const result = NUMBERS[Math.floor(Math.random() * NUMBERS.length)];
  //const result = 20; // remplace 20 par 2, 4, 5, 7, ou 10
  const urlParams = new URLSearchParams(window.location.search);
  const forceResult = urlParams.get('force');
  const result = forceResult && NUMBERS.includes(parseInt(forceResult)) // ajout à la fin de l'Url ?force=20, //2, 4, 5, 7 ou 10
  ? parseInt(forceResult)
  : NUMBERS[Math.floor(Math.random() * NUMBERS.length)]; 

  // Trouver les index des secteurs correspondants
  const targetIndexes = WHEEL_ORDER.reduce((acc,v,i)=> v===result ? [...acc,i] : acc, []);
  const targetIndex   = targetIndexes[Math.floor(Math.random()*targetIndexes.length)];

  // Angle désiré : secteur targetIndex doit se retrouver à 3h (0°)
  // Dans Python : desired = (99 - targetIndex*18) % 360
  // On adapte pour notre repère (roue part de 12h = -90°)
  // Secteur i → centre à -90° + (i+0.5)*18°
  // Pour que ce centre soit à 0° (droite = flèche) : rotation = 90° - (i+0.5)*18°
  const desiredAngle = (90 - (targetIndex + 0.5) * (360/WHEEL_ORDER.length) + 36000) % 360;
  const startAngle   = currentRot % 360;
  let   delta        = (desiredAngle - startAngle + 360) % 360;
  const endAngle     = currentRot + delta + 360 * 8; // 8 tours complets

  const DURATION = 6000; // ms
  const t0 = performance.now();

  function animate(now) {
    const t    = Math.min((now - t0) / DURATION, 1);
    // Easing cubique identique au Python : 1-(1-t)^3
    const ease = 1 - Math.pow(1-t, 3);
    const rot  = startAngle + (endAngle - startAngle) * ease;
    spinner.style.transform = `rotate(${rot}deg)`;
    if (t < 1) {
      requestAnimationFrame(animate);
    } else {
      currentRot = endAngle % 360;
      setTimeout(()=> showResult(result, total), 400);
    }
  }
  requestAnimationFrame(animate);
}

function showResult(result, totalBet) {
  // Calcul gain : uniquement les mises sur le résultat gagnant
  const won  = Object.entries(bets).filter(([m])=> parseInt(m)===result);
  const gain = won.reduce((s,[m,a])=> s + parseInt(m)*a, 0);
  const isWin = gain > 0;

  if (isWin) {
    balance += gain;
    refreshBalance();
  }
  saveBalance();

  // Detail des mises gagnantes
  const detailText = won.length > 0
    ? `${formatF(won[0][1])} × x${result}`
    : `Aucune mise sur x${result}`;

  const phone = document.querySelector('.phone');
  const overlay = document.createElement('div');
  overlay.className = 'result-overlay';
  overlay.innerHTML = `
    <div class="result-box">
      <div class="result-sector-label">Secteur tiré</div>
      <div class="result-mult" style="color:${COLORS[result]}">x${result}</div>
      <div class="result-detail">${detailText}</div>
      <div class="result-gain ${isWin?'win':'lose'}">
        ${isWin ? `Gain : <span>+${formatF(gain)}</span>` : `<span>Perdu</span>`}
      </div>
      <div class="result-new-balance">Solde : ${formatF(balance)}</div>
      <button class="result-btn" onclick="resetGame()">REJOUER</button>
    </div>`;
  phone.appendChild(overlay);
}

function resetGame() {
  document.querySelector('.result-overlay')?.remove();
  bets = {};
  selectedNum = null;
  document.querySelectorAll('.mult-btn').forEach(b => {
    b.classList.remove('selected');
    b.querySelector('.mult-sub')?.remove();
  });
  refreshMiseUI();
  showMsg('');
  document.getElementById('state-wheel').classList.add('hidden');
  document.getElementById('state-lobby').classList.remove('hidden');
}
