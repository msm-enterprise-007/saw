<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wheel — Fortune</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #0c0c0e;
    --surface:  #141417;
    --card:     #1b1b1f;
    --border:   #2a2a30;
    --gold:     #c9a84c;
    --gold-lt:  #e8cc80;
    --gold-dim: rgba(201,168,76,.12);
    --text:     #f0ede8;
    --muted:    #6b6a72;
    --soft:     #9e9ca6;
    --c2:  #4e85d4;
    --c4:  #c94f6e;
    --c5:  #7b5ea7;
    --c7:  #c96d32;
    --c10: #3a9e7e;
    --c20: #c9a84c;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }
  html { height: 100%; }
  body {
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 110px;
    gap: 22px;
  }
  header { text-align: center; }
  header h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(1.5rem, 5vw, 2.2rem);
    font-weight: 700;
    color: var(--gold-lt);
    letter-spacing: .02em;
  }
  header p {
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 4px;
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  .rule {
    width: 48px; height: 1px;
    background: linear-gradient(to right, transparent, var(--gold), transparent);
    flex-shrink: 0;
  }
  .section-label {
    font-size: 0.65rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
    margin-bottom: 10px;
  }
  .picks {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
  }
  .pick-btn {
    position: relative;
    width: 54px; height: 54px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--soft);
    font-family: 'Playfair Display', serif;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    transition: border-color .2s, color .2s, background .2s, transform .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .pick-btn:hover:not(:disabled) { border-color: var(--gold); color: var(--gold-lt); transform: scale(1.06); }
  .pick-btn.selected { background: var(--gold-dim); border-color: var(--gold); color: var(--gold-lt); }
  .pick-btn.selected::after {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: 50%;
    box-shadow: 0 0 12px rgba(201,168,76,.3);
    pointer-events: none;
  }
  .pick-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; }
  .pick-btn::before {
    content: '';
    position: absolute;
    bottom: 4px; left: 50%; transform: translateX(-50%);
    width: 6px; height: 6px;
    border-radius: 50%;
  }
  .pick-btn[data-val="2"]::before  { background: var(--c2); }
  .pick-btn[data-val="4"]::before  { background: var(--c4); }
  .pick-btn[data-val="5"]::before  { background: var(--c5); }
  .pick-btn[data-val="7"]::before  { background: var(--c7); }
  .pick-btn[data-val="10"]::before { background: var(--c10); }
  .pick-btn[data-val="20"]::before { background: var(--c20); }
  .wheel-area { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .wheel-wrap { position: relative; width: min(80vw, 340px); aspect-ratio: 1; }
  canvas {
    width: 100%; height: 100%;
    display: block;
    border-radius: 50%;
    box-shadow: 0 0 0 1px var(--border), 0 8px 40px rgba(0,0,0,.6);
    transition: opacity .3s;
  }
  .arrow-wrap { display: flex; flex-direction: column; align-items: center; gap: 3px; flex-shrink: 0; }
  .arrow {
    width: 0; height: 0;
    border-top: 11px solid transparent;
    border-bottom: 11px solid transparent;
    border-right: 22px solid var(--gold);
    filter: drop-shadow(0 0 8px rgba(201,168,76,.5));
  }
  .result-box {
    min-height: 44px;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.95rem; font-weight: 500;
    text-align: center; color: var(--muted);
    padding: 0 8px; transition: color .3s;
  }
  .result-box.win  { color: var(--gold-lt); }
  .result-box.lose { color: #c9607a; }
  .stats { display: flex; gap: 24px; justify-content: center; }
  .stat { text-align: center; }
  .stat-val {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem; font-weight: 700;
    color: var(--text);
  }
  .stat-val.green { color: var(--c10); }
  .stat-val.red   { color: #c9607a; }
  .stat-lbl { font-size: 0.62rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-top: 2px; }
  .history-section { width: 100%; max-width: 480px; }
  .history-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px; padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .history-title { font-size: 0.65rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .clear-btn {
    font-size: 0.65rem; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); background: none; border: none; cursor: pointer;
    padding: 2px 6px; border-radius: 4px; transition: color .15s;
  }
  .clear-btn:hover { color: #c9607a; }
  .history-empty { text-align: center; color: var(--muted); font-size: 0.82rem; padding: 20px 0; }
  .history-list { display: flex; flex-direction: column; gap: 6px; }
  .history-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px;
    font-size: 0.82rem;
    animation: slideIn .25s ease;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .hist-num { font-size: 0.62rem; color: var(--muted); min-width: 18px; text-align: right; }
  .hist-badge {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Playfair Display', serif; font-size: 0.8rem; font-weight: 700;
    flex-shrink: 0; color: #fff;
  }
  .hist-detail { flex: 1; color: var(--soft); font-size: 0.78rem; }
  .hist-detail strong { color: var(--text); font-weight: 600; }
  .hist-tag {
    font-size: 0.65rem; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; padding: 3px 8px; border-radius: 20px; flex-shrink: 0;
  }
  .hist-tag.win  { background: rgba(58,158,126,.15); color: var(--c10); }
  .hist-tag.lose { background: rgba(201,96,122,.12); color: #c9607a; }
  .play-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 14px 20px calc(14px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to top, var(--bg) 65%, transparent);
    display: flex; justify-content: center; z-index: 100;
  }
  .play-btn {
    width: 100%; max-width: 400px; height: 52px;
    border-radius: 8px; border: 1px solid var(--gold);
    background: transparent; color: var(--gold-lt);
    font-family: 'Inter', sans-serif; font-size: 0.85rem;
    font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
    cursor: pointer; transition: background .2s, color .2s, transform .1s, opacity .2s;
    -webkit-tap-highlight-color: transparent;
  }
  .play-btn:hover:not(:disabled) { background: var(--gold-dim); transform: scale(1.01); }
  .play-btn:active:not(:disabled) { transform: scale(0.98); }
  .play-btn:disabled { opacity: 0.25; cursor: not-allowed; border-color: var(--muted); color: var(--muted); }
  @media (min-width: 600px) {
    body { padding-bottom: 110px; }
    .wheel-wrap { width: min(60vw, 400px); }
    .pick-btn { width: 60px; height: 60px; }
  }
  @media (min-width: 960px) {
    body { flex-direction: row; flex-wrap: wrap; align-items: flex-start; justify-content: center; padding: 48px 40px 110px; gap: 40px; }
    .left-col { display: flex; flex-direction: column; align-items: center; gap: 20px; width: 280px; }
    .right-col { display: flex; flex-direction: column; align-items: flex-start; gap: 20px; }
    .wheel-wrap { width: 400px; }
    .history-section { max-width: 380px; }
    .play-btn { max-width: 460px; }
  }
</style>
</head>
<body>

<div class="left-col" id="leftCol">
  <header>
    <h1>La Roue</h1>
    <p>Jeu de prédiction</p>
  </header>
  <div class="rule"></div>
  <div style="width:100%">
    <p class="section-label">Mise — choisir un ou plusieurs</p>
    <div class="picks" id="picks">
      <button class="pick-btn" data-val="2">2</button>
      <button class="pick-btn" data-val="4">4</button>
      <button class="pick-btn" data-val="5">5</button>
      <button class="pick-btn" data-val="7">7</button>
      <button class="pick-btn" data-val="10">10</button>
      <button class="pick-btn" data-val="20">20</button>
    </div>
  </div>
  <div class="result-box" id="result">Sélectionne un ou plusieurs nombres.</div>
  <div class="rule"></div>
  <div class="stats">
    <div class="stat"><div class="stat-val" id="statTotal">0</div><div class="stat-lbl">Parties</div></div>
    <div class="stat"><div class="stat-val green" id="statWin">0</div><div class="stat-lbl">Victoires</div></div>
    <div class="stat"><div class="stat-val red" id="statLose">0</div><div class="stat-lbl">Défaites</div></div>
  </div>
</div>

<div class="right-col" id="rightCol">
  <div class="wheel-area">
    <div class="wheel-wrap" id="wheelWrap">
      <canvas id="wheel"></canvas>
    </div>
    <div class="arrow-wrap"><div class="arrow"></div></div>
  </div>
  <div class="history-section">
    <div class="history-header">
      <span class="history-title">Historique</span>
      <button class="clear-btn" id="clearBtn">Effacer</button>
    </div>
    <div id="historyList"><p class="history-empty">Aucune partie jouée.</p></div>
  </div>
</div>

<div class="play-bar">
  <button class="play-btn" id="playBtn" disabled>Lancer la roue</button>
</div>

<script>
// ============================================================
//  CONFIGURATION DE LA ROUE
//  Les 20 secteurs dans l'ordre physique sur la roue.
//  Chaque secteur a le même arc (18°) — la fréquence d'un
//  nombre dépend uniquement du nombre de fois qu'il apparaît.
// ============================================================
const SECTORS = [4,2,10,2,5,2,4,2,5,4,2,20,7,2,4,5,2,4,2,7];
const N   = SECTORS.length;           // 20 secteurs
const ARC = (2 * Math.PI) / N;       // arc de chaque secteur en radians

const COLORS = {
  2: '#4e85d4', 4: '#c94f6e', 5: '#7b5ea7',
  7: '#c96d32', 10: '#3a9e7e', 20: '#c9a84c'
};

// ============================================================
//  MOTEUR DE DÉCISION — "BACKEND"
//  C'est ici que toute la logique de manipulation est centralisée.
//  Invisible pour l'utilisateur, elle détermine le résultat
//  AVANT que l'animation ne commence.
// ============================================================
const ENGINE = {

  // ----------------------------------------------------------
  //  ÉTAT INTERNE DU MOTEUR
  //  Mémorisé entre chaque partie, jamais exposé à l'UI.
  // ----------------------------------------------------------
  state: {
    totalGames     : 0,       // nombre total de parties jouées
    lastLost       : null,    // dernier nombre sur lequel le joueur a PERDU
    lastMises      : [],      // mises du dernier tour
    firstGame      : true,    // flag : est-ce la toute première partie ?
    consecutiveLoss: 0,       // compteur de défaites consécutives
  },

  // ----------------------------------------------------------
  //  HEURE DÉCLENCHEUR
  //  À cette heure précise (HH:MM), la roue simulera un gain
  //  sur le 20 pour créer l'illusion d'un moment "chanceux".
  //  Configurable selon la stratégie souhaitée.
  // ----------------------------------------------------------
  TRIGGER_HOUR  : 21,
  TRIGGER_MINUTE: 41,

  // ----------------------------------------------------------
  //  PROBABILITÉS ÉGALES — BASE NEUTRE
  //  Chacun des 6 nombres a théoriquement 1/6 de chance.
  //  On choisit un secteur au hasard parmi les 20,
  //  ce qui donne des probabilités réelles proportionnelles
  //  à la fréquence d'apparition sur la roue.
  //  Cette fonction est le tirage "honnête" de référence.
  // ----------------------------------------------------------
  fairDraw() {
    const idx = Math.floor(Math.random() * N);
    return { value: SECTORS[idx], sectorIndex: idx };
  },

  // ----------------------------------------------------------
  //  TIRAGE FORCÉ SUR UNE VALEUR CIBLE
  //  Sélectionne aléatoirement un secteur qui correspond
  //  à la valeur souhaitée. Utilisé par les mécaniques de
  //  manipulation pour orienter le résultat sans que
  //  l'animation ne paraisse suspecte.
  // ----------------------------------------------------------
  forceDraw(targetValue) {
    const matching = SECTORS
      .map((v, i) => ({ v, i }))
      .filter(s => s.v === targetValue);
    const picked = matching[Math.floor(Math.random() * matching.length)];
    return { value: picked.v, sectorIndex: picked.i };
  },

  // ----------------------------------------------------------
  //  MÉCANIQUE 1 — MODE APPÂT (PREMIÈRE PARTIE)
  //  La toute première partie tombe toujours sur le 20.
  //  Objectif : créer immédiatement un sentiment de gain facile,
  //  ancrer positivement le joueur et l'inciter à continuer.
  //  La roue tourne lentement pour renforcer l'effet "suspense".
  // ----------------------------------------------------------
  isBaitMode() {
    return this.state.firstGame;
  },

  // ----------------------------------------------------------
  //  MÉCANIQUE 2 — HEURE DÉCLENCHEUR
  //  Si l'heure courante correspond exactement à l'heure
  //  programmée, le résultat est forcé sur le 20.
  //  Crée l'illusion d'un "moment favorable" récurrent,
  //  pousse le joueur à rejouer à cette heure précise.
  // ----------------------------------------------------------
  isTriggerTime() {
    const now = new Date();
    return now.getHours() === this.TRIGGER_HOUR &&
           now.getMinutes() === this.TRIGGER_MINUTE;
  },

  // ----------------------------------------------------------
  //  MÉCANIQUE 3 — REPLAY DU DERNIER PERDU
  //  Après une défaite, il y a une probabilité (30%) que le
  //  résultat suivant tombe exactement sur le nombre que le
  //  joueur avait misé et perdu au tour précédent.
  //  Effet psychologique : frustration ("j'aurais dû rejouer !"),
  //  puis obsession de "rattraper" la mise en rejouant le même.
  // ----------------------------------------------------------
  shouldReplayLoss(mises) {
    if (!this.state.lastLost) return false;
    // On ne rejoue le perdu que si le joueur n'a PAS remis
    // dessus (sinon l'effet est nul — il gagnerait)
    const didNotReMise = !mises.includes(this.state.lastLost);
    const probability  = Math.random() < 0.30; // 30% de chances
    return didNotReMise && probability;
  },

  // ----------------------------------------------------------
  //  MÉCANIQUE 4 — BUG SIMULÉ (DISPARITION DE LA ROUE)
  //  Après plusieurs défaites consécutives (seuil : 4),
  //  un "bug visuel" est déclenché : la roue disparaît 2s.
  //  Pendant ce temps le résultat est recalculé côté moteur
  //  pour tomber sur un secteur défavorable au joueur.
  //  Effet : le joueur pense à un bug technique, pas à une
  //  manipulation. Sa méfiance est désamorcée.
  // ----------------------------------------------------------
  shouldTriggerBug() {
    return this.state.consecutiveLoss >= 4 && Math.random() < 0.40;
  },

  // ----------------------------------------------------------
  //  POINT D'ENTRÉE PRINCIPAL — DÉCISION DU RÉSULTAT
  //  Appelé au moment du spin, AVANT l'animation.
  //  Retourne : { value, sectorIndex, slowSpin, bugMode }
  //    - value       : valeur du secteur gagnant
  //    - sectorIndex : index du secteur sur la roue
  //    - slowSpin    : true = animation lente (mode appât/heure)
  //    - bugMode     : true = déclencher le bug visuel
  // ----------------------------------------------------------
  decide(mises) {
    this.state.totalGames++;
    let result;
    let slowSpin = false;
    let bugMode  = false;

    // PRIORITÉ 1 — Première partie : appât sur le 20
    if (this.isBaitMode()) {
      result   = this.forceDraw(20);
      slowSpin = true; // roue lente pour l'effet dramatique
      this.state.firstGame = false;
    }

    // PRIORITÉ 2 — Heure déclencheur : forcer le 20
    else if (this.isTriggerTime()) {
      result   = this.forceDraw(20);
      slowSpin = true;
    }

    // PRIORITÉ 3 — Bug simulé après série de défaites
    else if (this.shouldTriggerBug()) {
      // On tire un résultat perdant pour le joueur
      const losingVals = SECTORS.filter(v => !mises.includes(v));
      const target = losingVals[Math.floor(Math.random() * losingVals.length)];
      result  = this.forceDraw(target);
      bugMode = true; // déclenchera la disparition visuelle
      this.state.consecutiveLoss = 0; // reset après le bug
    }

    // PRIORITÉ 4 — Replay du dernier perdu (frustration)
    else if (this.shouldReplayLoss(mises)) {
      result = this.forceDraw(this.state.lastLost);
    }

    // DÉFAUT — Tirage aléatoire standard
    else {
      result = this.fairDraw();
    }

    // Mise à jour de l'état interne pour le prochain tour
    const win = mises.includes(result.value);
    if (!win) {
      // Mémoriser la première mise perdue comme "lastLost"
      this.state.lastLost = mises[0];
      this.state.consecutiveLoss++;
    } else {
      this.state.consecutiveLoss = 0;
      this.state.lastLost = null;
    }
    this.state.lastMises = [...mises];

    return { ...result, slowSpin, bugMode };
  }
};

// ============================================================
//  UI & ANIMATION
// ============================================================
const canvas    = document.getElementById('wheel');
const ctx       = canvas.getContext('2d');
const playBtn   = document.getElementById('playBtn');
const resultEl  = document.getElementById('result');
const picksEl   = document.getElementById('picks');
const histList  = document.getElementById('historyList');
const clearBtn  = document.getElementById('clearBtn');
const statTotal = document.getElementById('statTotal');
const statWin   = document.getElementById('statWin');
const statLose  = document.getElementById('statLose');

let currentAngle = 0;
let spinning     = false;
let chosen       = new Set();
let gameCount    = 0;
let winCount     = 0;

/* ── Resize canvas ── */
function resize() {
  const wrap = document.getElementById('wheelWrap');
  const size = wrap.offsetWidth;
  canvas.width  = size * devicePixelRatio;
  canvas.height = size * devicePixelRatio;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  draw(currentAngle);
}

/* ── Dessin de la roue ── */
function draw(angle) {
  const size = canvas.width / devicePixelRatio;
  const cx = size / 2, cy = size / 2, r = size / 2 - 3;
  ctx.clearRect(0, 0, size, size);

  for (let i = 0; i < N; i++) {
    const start = angle + i * ARC;
    const end   = start + ARC;
    const val   = SECTORS[i];
    const sel   = chosen.has(val);

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, start, end);
    ctx.closePath();
    ctx.fillStyle = sel ? lighten(COLORS[val]) : COLORS[val];
    ctx.fill();
    ctx.strokeStyle = sel ? 'rgba(255,255,255,.35)' : 'rgba(0,0,0,.35)';
    ctx.lineWidth = sel ? 2 : 1;
    ctx.stroke();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(start + ARC / 2);
    ctx.textAlign = 'right';
    ctx.fillStyle = val === 20 ? '#1a1a1a' : 'rgba(255,255,255,.92)';
    ctx.font = `700 ${Math.max(10, size * 0.05)}px 'Playfair Display', serif`;
    ctx.fillText(String(val), r - 10, 5);
    ctx.restore();
  }

  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, 2 * Math.PI);
  ctx.strokeStyle = 'rgba(201,168,76,.25)';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(cx, cy, size * 0.09, 0, 2 * Math.PI);
  ctx.fillStyle = '#0c0c0e';
  ctx.fill();
  ctx.strokeStyle = 'rgba(201,168,76,.3)';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function lighten(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgb(${Math.min(255,r+45)},${Math.min(255,g+45)},${Math.min(255,b+45)})`;
}

/* ── Sélection multi ── */
function updatePlayBtn() {
  playBtn.disabled = chosen.size === 0 || spinning;
  if (chosen.size === 0) {
    resultEl.textContent = 'Sélectionne un ou plusieurs nombres.';
    resultEl.className = 'result-box';
  } else {
    const list = [...chosen].sort((a,b)=>a-b).join(', ');
    resultEl.textContent = `Mise : ${list} — Prêt à jouer.`;
    resultEl.className = 'result-box';
  }
}

picksEl.querySelectorAll('.pick-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (spinning) return;
    const val = parseInt(btn.dataset.val);
    if (chosen.has(val)) { chosen.delete(val); btn.classList.remove('selected'); }
    else                  { chosen.add(val);    btn.classList.add('selected'); }
    draw(currentAngle);
    updatePlayBtn();
  });
});

/* ── Spin ── */
playBtn.addEventListener('click', () => {
  if (spinning || chosen.size === 0) return;

  const mises = [...chosen].sort((a,b)=>a-b);

  // ----------------------------------------------------------
  //  APPEL AU MOTEUR — décision prise avant toute animation
  //  Le résultat est connu ici ; l'animation va juste "jouer"
  //  jusqu'à l'angle correspondant à ce secteur.
  // ----------------------------------------------------------
  const decision = ENGINE.decide(mises);

  spinning = true;
  playBtn.disabled = true;
  picksEl.querySelectorAll('.pick-btn').forEach(b => b.disabled = true);
  resultEl.textContent = 'La roue tourne…';
  resultEl.className = 'result-box';

  // ----------------------------------------------------------
  //  BUG MODE — disparition visuelle de la roue 2 secondes
  //  Le canvas devient invisible, puis réapparaît sur le
  //  secteur déjà décidé par le moteur.
  // ----------------------------------------------------------
  if (decision.bugMode) {
    canvas.style.opacity = '0';
    setTimeout(() => {
      canvas.style.opacity = '1';
      // On positionne la roue directement sur le résultat
      // sans animation supplémentaire — effet "téléportation"
      landOnSector(decision.sectorIndex, false);
    }, 2000);
    return;
  }

  // ----------------------------------------------------------
  //  ANIMATION NORMALE vers le secteur décidé
  //  slowSpin = true → durée longue + peu de tours (mode appât)
  //  slowSpin = false → comportement standard
  // ----------------------------------------------------------
  spinToSector(decision.sectorIndex, decision.slowSpin);
});

// ============================================================
//  CALCUL DE L'ANGLE CIBLE pour un secteur donné
//  On calcule l'angle exact pour que le milieu du secteur
//  visé soit parfaitement aligné avec la flèche (angle 0).
// ============================================================
function angleForSector(sectorIndex) {
  // Milieu du secteur = index * ARC + ARC/2
  // On veut ce milieu à l'angle 0 (position de la flèche)
  // donc on soustrait, puis on normalise
  const mid = sectorIndex * ARC + ARC / 2;
  return (2 * Math.PI - mid) % (2 * Math.PI);
}

function spinToSector(sectorIndex, slowSpin) {
  const targetAngle = angleForSector(sectorIndex);
  const extraSpins  = slowSpin
    ? 1 + Math.floor(Math.random() * 2)   // 1-2 tours : lent, dramatique
    : 5 + Math.floor(Math.random() * 6);  // 5-10 tours : normal

  // Ajustement pour atterrir exactement sur la cible
  const norm    = ((currentAngle % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
  let   delta   = targetAngle - norm;
  if (delta < 0) delta += 2 * Math.PI;
  const total   = extraSpins * 2 * Math.PI + delta;

  const duration   = slowSpin
    ? 5000 + Math.random() * 2000   // 5-7s pour le mode appât
    : 3800 + Math.random() * 1500;  // 3.8-5.3s normal

  const tStart     = performance.now();
  const startAngle = currentAngle;

  function easeOut(t) { return 1 - Math.pow(1 - t, 4); }

  (function animate(now) {
    const t = Math.min((now - tStart) / duration, 1);
    currentAngle = startAngle + total * easeOut(t);
    draw(currentAngle);
    if (t < 1) requestAnimationFrame(animate);
    else {
      currentAngle = startAngle + total;
      draw(currentAngle);
      landOnSector(sectorIndex, true);
    }
  })(performance.now());
}

// ============================================================
//  RÉSULTAT FINAL — affichage et mise à jour de l'état
// ============================================================
function landOnSector(sectorIndex, animated) {
  // Si on arrive via bugMode, on positionne la roue manuellement
  if (!animated) {
    currentAngle = angleForSector(sectorIndex);
    draw(currentAngle);
  }

  const landed = SECTORS[sectorIndex];
  const mises  = [...chosen].sort((a,b)=>a-b);
  const win    = chosen.has(landed);

  if (win) {
    resultEl.innerHTML = `<strong>${landed}</strong> — Victoire !`;
    resultEl.className = 'result-box win';
  } else {
    resultEl.innerHTML = `<strong>${landed}</strong> — Défaite.`;
    resultEl.className = 'result-box lose';
  }

  gameCount++;
  if (win) winCount++;
  statTotal.textContent = gameCount;
  statWin.textContent   = winCount;
  statLose.textContent  = gameCount - winCount;

  addHistoryEntry(gameCount, landed, mises, win);

  spinning = false;
  picksEl.querySelectorAll('.pick-btn').forEach(b => b.disabled = false);
  playBtn.disabled = chosen.size === 0;
}

/* ── Historique ── */
function addHistoryEntry(num, landed, mises, win) {
  const empty = histList.querySelector('.history-empty');
  if (empty) empty.remove();

  const row = document.createElement('div');
  row.className = 'history-row';
  const color = COLORS[landed] || '#888';
  row.innerHTML = `
    <span class="hist-num">${num}</span>
    <span class="hist-badge" style="background:${color}">${landed}</span>
    <span class="hist-detail">Mise sur <strong>${mises.join(', ')}</strong></span>
    <span class="hist-tag ${win ? 'win' : 'lose'}">${win ? 'Gagné' : 'Perdu'}</span>
  `;
  histList.insertBefore(row, histList.firstChild);
}

clearBtn.addEventListener('click', () => {
  histList.innerHTML = '<p class="history-empty">Aucune partie jouée.</p>';
  gameCount = 0; winCount = 0;
  statTotal.textContent = '0';
  statWin.textContent   = '0';
  statLose.textContent  = '0';
  resultEl.textContent  = 'Sélectionne un ou plusieurs nombres.';
  resultEl.className    = 'result-box';
  // Reset du moteur aussi
  ENGINE.state.totalGames      = 0;
  ENGINE.state.lastLost        = null;
  ENGINE.state.firstGame       = true;
  ENGINE.state.consecutiveLoss = 0;
});

/* ── Init ── */
const ro = new ResizeObserver(() => { ctx.setTransform(1,0,0,1,0,0); resize(); });
ro.observe(document.getElementById('wheelWrap'));
resize();
</script>
</body>
</html>
